<form class="formulario" (submit)="alEnviar($event)" novalidate>

  <!-- Foto de perfil -->
  <div class="campo">
    <span class="etiqueta">Foto de perfil <span class="opcional">(opcional)</span></span>
    <div class="subir-imagen">
      <div class="avatar-previa" [class.con-error]="errorImagen()">
        @if (vistaPrevia()) {
          <img [src]="vistaPrevia()" alt="Vista previa de la foto de perfil">
        } @else {
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2.5c1.2 3.6 5 5.4 5 9.6a5 5 0 0 1-10 0c0-2.2 1.1-3.6 2.2-4.6.3 1.7 1.1 2.7 2.2 3C11 7.8 11.2 5 12 2.5z"/>
            <path d="M4.5 21.5l15-3.5M4.5 18l15 3.5"/>
          </svg>
        }
      </div>
      <div class="subir-texto">
        <input #inputImagen id="imagen-usuario" type="file" class="oculto-visual"
               accept="image/jpeg,image/png,image/webp" (change)="elegirImagen($event)">
        <div class="botones-imagen">
          <label for="imagen-usuario" class="btn btn-secundario">{{ imagen() ? 'Cambiar foto' : 'Elegir foto' }}</label>
          @if (imagen() || errorImagen()) {
            <button type="button" class="btn btn-secundario" (click)="quitarImagen(inputImagen)">Quitar</button>
          }
        </div>
        <small class="ayuda">JPG, PNG o WEBP, hasta 2 MB. Si no se elige ninguna, va una fogata.</small>
      </div>
    </div>
    @if (errorImagen()) {
      <div class="error-campo" aria-live="polite">{{ errorImagen() }}</div>
    }
  </div>

  <div class="fila-doble">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" autocomplete="given-name" [formField]="usuarioForm.nombre"
             [class.invalido]="usuarioForm.nombre().touched() && usuarioForm.nombre().invalid()">
      <app-errores-campo [campo]="usuarioForm.nombre" />
    </div>
    <div class="campo">
      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" autocomplete="family-name" [formField]="usuarioForm.apellido"
             [class.invalido]="usuarioForm.apellido().touched() && usuarioForm.apellido().invalid()">
      <app-errores-campo [campo]="usuarioForm.apellido" />
    </div>
  </div>

  <div class="fila-doble">
    <div class="campo">
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="email" [formField]="usuarioForm.correo"
             [class.invalido]="usuarioForm.correo().touched() && usuarioForm.correo().invalid()">
      <app-errores-campo [campo]="usuarioForm.correo" />
    </div>
    <div class="campo">
      <label for="nombreUsuario">Nombre de usuario</label>
      <input id="nombreUsuario" type="text" autocomplete="username" [formField]="usuarioForm.nombreUsuario"
             [class.invalido]="usuarioForm.nombreUsuario().touched() && usuarioForm.nombreUsuario().invalid()">
      <app-errores-campo [campo]="usuarioForm.nombreUsuario" />
    </div>
  </div>

  <div class="fila-doble">
    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" [type]="mostrarPasswords() ? 'text' : 'password'" autocomplete="new-password"
             [formField]="usuarioForm.password"
             [class.invalido]="usuarioForm.password().touched() && usuarioForm.password().invalid()">
      <app-errores-campo [campo]="usuarioForm.password" />
    </div>
    <div class="campo">
      <label for="repetirPassword">Repetir contraseña</label>
      <input id="repetirPassword" [type]="mostrarPasswords() ? 'text' : 'password'" autocomplete="new-password"
             [formField]="usuarioForm.repetirPassword"
             [class.invalido]="usuarioForm.repetirPassword().touched() && usuarioForm.repetirPassword().invalid()">
      <app-errores-campo [campo]="usuarioForm.repetirPassword" />
    </div>
  </div>
  <label class="check">
    <input type="checkbox" [checked]="mostrarPasswords()" (change)="mostrarPasswords.set(!mostrarPasswords())">
    Mostrar contraseñas
  </label>

  <div class="campo campo-fecha">
    <label for="fechaNacimiento">Fecha de nacimiento</label>
    <input id="fechaNacimiento" type="date" autocomplete="bday" [formField]="usuarioForm.fechaNacimiento"
           [class.invalido]="usuarioForm.fechaNacimiento().touched() && usuarioForm.fechaNacimiento().invalid()">
    <app-errores-campo [campo]="usuarioForm.fechaNacimiento" />
  </div>

  <div class="campo">
    <label for="descripcion">Descripción breve <span class="opcional">(opcional)</span></label>
    <textarea id="descripcion" rows="3" [formField]="usuarioForm.descripcion"
              [class.invalido]="usuarioForm.descripcion().touched() && usuarioForm.descripcion().invalid()"></textarea>
    <div class="pie-campo">
      <app-errores-campo [campo]="usuarioForm.descripcion" />
      <small class="contador">{{ modelo().descripcion.length }}/200</small>
    </div>
  </div>

  @if (mostrarPerfil()) {
    <fieldset class="perfil">
      <legend>Perfil</legend>
      <label class="opcion">
        <input type="radio" name="perfil" value="usuario"
               [checked]="perfil() === 'usuario'" (change)="perfil.set('usuario')">
        Usuario
      </label>
      <label class="opcion">
        <input type="radio" name="perfil" value="administrador"
               [checked]="perfil() === 'administrador'" (change)="perfil.set('administrador')">
        Administrador
      </label>
    </fieldset>
  }

  <button type="submit" class="btn btn-primario btn-ancho" [disabled]="enviando()">
    {{ enviando() ? textoEnviando() : textoBoton() }}
  </button>

  <ng-content />
</form>
