<div class="pantalla">
  <header class="encabezado">
    <a routerLink="/login" class="logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F2711C" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.5c1.2 3.6 5 5.4 5 9.6a5 5 0 0 1-10 0c0-2.2 1.1-3.6 2.2-4.6.3 1.7 1.1 2.7 2.2 3C11 7.8 11.2 5 12 2.5z"/>
        <path d="M4.5 21.5l15-3.5M4.5 18l15 3.5"/>
      </svg>
      <span>Fogón</span>
    </a>
    <h1>Sumate al fogón</h1>
    <p>Creá tu cuenta para contar tus historias y sumar leña a las de los demás.</p>
  </header>

   <app-formulario-usuario class="tarjeta-papel formulario-registro"
                          [enviando]="enviando()"
                          textoBoton="Crear cuenta"
                          textoEnviando="Creando tu cuenta…"
                          (enviar)="registrarse($event)">
    <p class="alternativa">¿Ya tenés cuenta? <a routerLink="/login">Entrá al fogón</a></p>
  </app-formulario-usuario>
</div>
