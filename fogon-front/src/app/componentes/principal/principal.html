<header class="barra">
  <a routerLink="/publicaciones" class="logo">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F2711C" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2.5c1.2 3.6 5 5.4 5 9.6a5 5 0 0 1-10 0c0-2.2 1.1-3.6 2.2-4.6.3 1.7 1.1 2.7 2.2 3C11 7.8 11.2 5 12 2.5z"/>
      <path d="M4.5 21.5l15-3.5M4.5 18l15 3.5"/>
    </svg>
    <span>Fogón</span>
  </a>

  <button type="button" class="btn-icono" (click)="tema.alternar()"
          [attr.aria-label]="tema.modo() === 'noche' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
    @if (tema.modo() === 'noche') {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
      </svg>
    }
  </button>
</header>

<div class="contenedor">
  <nav class="nav-lateral" aria-label="Secciones">
    <a routerLink="/publicaciones" routerLinkActive="activo" ariaCurrentWhenActive="page">Publicaciones</a>
    <a routerLink="/mi-perfil" routerLinkActive="activo" ariaCurrentWhenActive="page">Mi perfil</a>
    <hr>
    <a routerLink="/login" class="tenue">Cerrar sesión</a>
  </nav>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
