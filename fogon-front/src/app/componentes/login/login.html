<div class="pantalla">
  <section class="presentacion">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#F2711C" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2.5c1.2 3.6 5 5.4 5 9.6a5 5 0 0 1-10 0c0-2.2 1.1-3.6 2.2-4.6.3 1.7 1.1 2.7 2.2 3C11 7.8 11.2 5 12 2.5z"/>
      <path d="M4.5 21.5l15-3.5M4.5 18l15 3.5"/>
    </svg>
    <h1>Fogón</h1>
    <p class="lema">Las historias del movimiento scout, alrededor del fuego.</p>
    <ul class="puntos">
      <li><span class="punto brasa"></span>Contá tus salidas y campamentos</li>
      <li><span class="punto llama"></span>Sumá leña a las historias que te gustan</li>
      <li><span class="punto papel"></span>Charlá con otros scouts en la ronda</li>
    </ul>
  </section>

  <form class="tarjeta-papel formulario" (submit)="entrar($event)" novalidate>
    <h2>Entrá al fogón</h2>

    <div class="campo">
      <label for="identificador">Correo o nombre de usuario</label>
      <input id="identificador" type="text" autocomplete="username"
             [formField]="loginForm.identificador"
             [class.invalido]="loginForm.identificador().touched() && loginForm.identificador().invalid()">
      <app-errores-campo [campo]="loginForm.identificador" />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="con-boton">
        <input id="password" [type]="mostrarPassword() ? 'text' : 'password'" autocomplete="current-password"
               [formField]="loginForm.password"
               [class.invalido]="loginForm.password().touched() && loginForm.password().invalid()">
        <button type="button" class="btn-ver" (click)="mostrarPassword.set(!mostrarPassword())">
          {{ mostrarPassword() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      <app-errores-campo [campo]="loginForm.password" />
    </div>

    <button type="submit" class="btn btn-primario btn-ancho">Entrar</button>

    <p class="alternativa">¿Primera vez? <a routerLink="/registro">Sumate al fogón</a></p>
  </form>
</div>
