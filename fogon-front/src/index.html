<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fogón</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Aplica el tema guardado ANTES de que cargue Angular, para que no "parpadee"
    try {
      if (localStorage.getItem('fogon-tema') === 'claro') {
        document.documentElement.setAttribute('data-tema', 'claro');
      }
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
