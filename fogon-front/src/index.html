<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fogón</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="Fogón, la red social de la comunidad scout.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#15120E">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Fogón">
  <script>
    // Aplica el tema guardado ANTES de que cargue Angular, para que no "parpadee"
    try {
      if (localStorage.getItem('fogon-tema') === 'claro') {
        document.documentElement.setAttribute('data-tema', 'claro');
      }
    } catch {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
    <noscript>Para usar Fogón necesitás activar JavaScript.</noscript>
</body>
</html>
